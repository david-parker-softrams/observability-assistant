# LogAI Model Configuration - Built-in Defaults
# DO NOT EDIT THIS FILE - Create ~/.logai/model_config.yaml for custom settings
#
# This file contains default model configurations for token counting and context management.
# Models are matched using substring matching (e.g., "qwen3" matches "qwen3:32b", "qwen3:70b").
#
# Schema version for future compatibility
schema_version: "1.0"

models:
  # ===================
  # OpenAI Models
  # ===================

  gpt-4:
    context_window: 8192
    encoding: cl100k_base

  gpt-4-turbo:
    context_window: 128000
    encoding: cl100k_base

  gpt-4-turbo-preview:
    context_window: 128000
    encoding: cl100k_base

  gpt-4o:
    context_window: 128000
    encoding: o200k_base

  # ===================
  # Anthropic Models
  # ===================

  claude-3-5-sonnet:
    context_window: 200000
    encoding: cl100k_base

  claude-3-5-sonnet-20241022:
    context_window: 200000
    encoding: cl100k_base

  claude-3-opus:
    context_window: 200000
    encoding: cl100k_base

  claude-opus-4:
    context_window: 200000
    encoding: cl100k_base

  claude-sonnet-4:
    context_window: 200000
    encoding: cl100k_base

  # Generic claude pattern (matches claude-*, including github-copilot variants)
  claude:
    encoding: cl100k_base

  # ===================
  # GitHub Copilot
  # ===================

  github-copilot:
    encoding: cl100k_base

  # ===================
  # Local Ollama Models
  # ===================

  llama3.1:8b:
    context_window: 8192
    encoding: cl100k_base

  llama3.1:70b:
    context_window: 128000
    encoding: cl100k_base

  llama3.1:
    context_window: 8192
    encoding: cl100k_base

  qwen3:
    context_window: 32768
    encoding: cl100k_base

  mistral:
    context_window: 32768
    encoding: cl100k_base

  codellama:
    context_window: 16384
    encoding: cl100k_base

  # Reasoning models with extended context
  openthinker:32b:
    context_window: 131072
    encoding: cl100k_base

  openthinker:
    context_window: 131072
    encoding: cl100k_base

  deepseek-r1:32b:
    context_window: 131072
    encoding: cl100k_base

  deepseek-r1:
    context_window: 131072
    encoding: cl100k_base

# Default values for unknown models
# These are used when no model pattern matches
defaults:
  context_window: 8192
  encoding: cl100k_base
  chars_per_token: 3.5
